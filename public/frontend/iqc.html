<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IQC Dashboard — SCHILLER Healthcare India</title>
    
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --navy: #0D1B2A;
            --red: #C8102E;
            --white: #FFFFFF;
            --fog: #F0F4F8;
            --steel: #6B8CAE;
            --mid: #2C4A6E;
            --text: #1A2B3C;
            --amber: #C77B12;
            --green: #1E7B4D;
            --sidebar-w: 248px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Calibri', Calibri, sans-serif;
            color: var(--text);
            background: var(--fog);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ───────────────────────── SIDEBAR ───────────────────────── */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: var(--navy);
            display: flex;
            flex-direction: column;
            z-index: 200;
            transition: transform 0.25s ease;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 22px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-logo-mark {
            width: 34px;
            height: 34px;
            min-width: 34px;
            background: var(--red);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-logo-mark svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .sidebar-brand {
            font-family: 'Calibri', Calibri, sans-serif;
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        .sidebar-brand span {
            color: var(--red);
        }

        .sidebar-brand small {
            display: block;
            font-family: 'Calibri', Calibri, sans-serif;
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 18px 14px;
        }

        .nav-group-label {
            font-size: 0.64rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.28);
            padding: 14px 12px 8px;
        }

        .nav-group-label:first-child {
            padding-top: 4px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.58);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 2px;
            position: relative;
            transition: background 0.15s, color 0.15s;
        }

        .sidebar-link svg {
            width: 18px;
            height: 18px;
            min-width: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;
        }

        .sidebar-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.9);
        }

        .sidebar-link.active {
            background: rgba(200, 16, 46, 0.14);
            color: var(--white);
        }

        .sidebar-link.active::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: var(--red);
            border-radius: 0 3px 3px 0;
        }

        .sidebar-link .badge {
            margin-left: auto;
            background: var(--red);
            color: white;
            font-size: 0.66rem;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 20px;
            line-height: 1.5;
        }

        .sidebar-link .badge.muted {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.55);
        }

        .sidebar-foot {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-avatar {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 50%;
            background: var(--mid);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.74rem;
            font-weight: 700;
            color: white;
        }

        .sidebar-user-name {
            font-size: 0.78rem;
            font-weight: 600;
            color: white;
        }

        .sidebar-user-role {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.4);
        }

        /* ───────────────────────── MAIN ───────────────────────── */
        .main {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            background: var(--white);
            border-bottom: 1px solid rgba(13, 27, 42, 0.08);
            padding: 0 32px;
            height: 68px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            width: 36px;
            height: 36px;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            color: var(--navy);
        }

        .menu-toggle svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .breadcrumb {
            font-size: 0.72rem;
            color: var(--steel);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .breadcrumb span {
            color: var(--navy);
        }

        .topbar-title {
            font-family: 'Calibri', Calibri, sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--navy);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--fog);
            border-radius: 6px;
            padding: 8px 14px;
            min-width: 240px;
        }

        .search-box svg {
            width: 16px;
            height: 16px;
            stroke: var(--steel);
            fill: none;
            stroke-width: 2;
        }

        .search-box input {
            border: none;
            background: none;
            outline: none;
            font-size: 0.82rem;
            color: var(--text);
            width: 100%;
            font-family: 'Calibri', Calibri, sans-serif;
        }

        .search-box input::placeholder {
            color: #9ab0c2;
        }

        .icon-btn {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: 1px solid rgba(13, 27, 42, 0.08);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--mid);
            transition: background 0.15s;
        }

        .icon-btn:hover {
            background: var(--fog);
        }

        .icon-btn svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .icon-btn .dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--red);
            border: 1.5px solid white;
        }

        .btn-new {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--red);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .btn-new:hover {
            background: #a50d23;
            transform: translateY(-1px);
        }

        .btn-new svg {
            width: 15px;
            height: 15px;
            stroke: white;
            fill: none;
            stroke-width: 2.2;
        }

        /* ───────────────────────── CONTENT ───────────────────────── */
        .content {
            flex: 1;
            padding: 28px 32px 60px;
        }

        .page-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 26px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-head h1 {
            font-family: 'Calibri', Calibri, sans-serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 6px;
        }

        .page-head p {
            font-size: 0.86rem;
            color: var(--steel);
            max-width: 520px;
        }

        .head-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-outline-navy {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1.5px solid rgba(13, 27, 42, 0.14);
            color: var(--navy);
            background: white;
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .btn-outline-navy:hover {
            border-color: var(--steel);
            background: var(--fog);
        }

        .btn-outline-navy svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* KPI cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .kpi-card {
            background: white;
            border-radius: 10px;
            padding: 20px 22px;
            border: 1px solid rgba(13, 27, 42, 0.06);
            position: relative;
            overflow: hidden;
        }

        .kpi-card.accent::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent-color, var(--red));
        }

        .kpi-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .kpi-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--fog);
        }

        .kpi-icon svg {
            width: 18px;
            height: 18px;
            stroke: var(--navy);
            fill: none;
            stroke-width: 1.8;
        }

        .kpi-card.c-red .kpi-icon {
            background: rgba(200, 16, 46, 0.1);
        }

        .kpi-card.c-red .kpi-icon svg {
            stroke: var(--red);
        }

        .kpi-card.c-amber .kpi-icon {
            background: rgba(199, 123, 18, 0.1);
        }

        .kpi-card.c-amber .kpi-icon svg {
            stroke: var(--amber);
        }

        .kpi-card.c-green .kpi-icon {
            background: rgba(30, 123, 77, 0.1);
        }

        .kpi-card.c-green .kpi-icon svg {
            stroke: var(--green);
        }

        .kpi-trend {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .kpi-trend.up {
            background: rgba(30, 123, 77, 0.1);
            color: var(--green);
        }

        .kpi-trend.down {
            background: rgba(200, 16, 46, 0.1);
            color: var(--red);
        }

        .kpi-value {
            font-family: 'Calibri', Calibri, sans-serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--navy);
            line-height: 1;
        }

        .kpi-value sup {
            font-size: 0.9rem;
            color: var(--steel);
            font-weight: 500;
        }

        .kpi-label {
            font-size: 0.74rem;
            color: var(--steel);
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
        }

        .btn-new:hover {
            background: #a50d23;
            transform: translateY(-1px);
        }

        .btn-new svg {
            width: 15px;
            height: 15px;
            stroke: white;
            fill: none;
            stroke-width: 2.2;
        }

        /* ───────────────────────── CONTENT ───────────────────────── */
        .content {
            flex: 1;
            padding: 28px 32px 60px;
        }

        .page-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 26px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-head h1 {
            font-family: 'Calibri', Calibri, sans-serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 6px;
        }

        .head-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-outline-navy {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1.5px solid rgba(13, 27, 42, 0.14);
            color: var(--navy);
            background: white;
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .btn-outline-navy:hover {
            border-color: var(--steel);
            background: var(--fog);
        }

        .btn-outline-navy svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* Main grid: table */
        .dash-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: white;
            border-radius: 10px;
            border: 1px solid rgba(13, 27, 42, 0.06);
            margin-bottom: 20px;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            border-bottom: 1px solid var(--fog);
        }

        .panel-head h2 {
            font-family: 'Calibri', Calibri, sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--navy);
        }

        .panel-head .panel-sub {
            font-size: 0.74rem;
            color: var(--steel);
            margin-top: 2px;
            font-weight: 400;
            font-family: 'Calibri', Calibri, sans-serif;
        }

        .filter-chips {
            display: flex;
            gap: 6px;
        }

        .chip {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            background: var(--fog);
            color: var(--steel);
            cursor: pointer;
            border: none;
            transition: background 0.15s, color 0.15s;
        }

        .chip.active {
            background: var(--navy);
            color: white;
        }

        /* Table */
        table.iqc-table {
            width: 100%;
            border-collapse: collapse;
        }

        .iqc-table thead th {
            text-align: left;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--steel);
            padding: 12px 22px;
            border-bottom: 1px solid var(--fog);
            white-space: nowrap;
        }

        .iqc-table tbody td {
            padding: 14px 22px;
            font-size: 0.82rem;
            color: var(--text);
            border-bottom: 1px solid var(--fog);
            white-space: nowrap;
        }

        .iqc-table tbody tr:last-child td {
            border-bottom: none;
        }

        .iqc-table tbody tr {
            transition: background 0.15s;
        }

        .iqc-table tbody tr:hover {
            background: #fafcfe;
        }

        .cell-part {
            font-weight: 600;
            color: var(--navy);
        }

        .cell-sub {
            display: block;
            font-size: 0.7rem;
            color: var(--steel);
            font-weight: 400;
            margin-top: 1px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: 20px;
        }

        .status-pill::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-pill.pending {
            background: rgba(199, 123, 18, 0.1);
            color: var(--amber);
        }

        .status-pill.passed {
            background: rgba(30, 123, 77, 0.1);
            color: var(--green);
        }

        .status-pill.rejected {
            background: rgba(200, 16, 46, 0.1);
            color: var(--red);
        }

        .status-pill.hold {
            background: rgba(107, 140, 174, 0.14);
            color: var(--mid);
        }

        .aql-tag {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--mid);
            background: var(--fog);
            padding: 3px 9px;
            border-radius: 4px;
        }

        .row-action {
            background: none;
            border: 1px solid rgba(13, 27, 42, 0.1);
            color: var(--navy);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .row-action:hover {
            background: var(--fog);
        }

        .panel-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 22px;
            font-size: 0.74rem;
            color: var(--steel);
        }

        .pager {
            display: flex;
            gap: 4px;
        }

        .pager button {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid rgba(13, 27, 42, 0.08);
            background: white;
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--mid);
            cursor: pointer;
        }

        .pager button.active {
            background: var(--navy);
            color: white;
            border-color: var(--navy);
        }

        /* ───────────────────────── RESPONSIVE ───────────────────────── */
        @media (max-width: 1180px) {
            .dash-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 860px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }

            .menu-toggle {
                display: flex;
            }

            .search-box {
                display: none;
            }
        }

        @media (max-width: 560px) {
            .content {
                padding: 20px 16px 40px;
            }

            .topbar {
                padding: 0 16px;
            }

            .iqc-table {
                font-size: 0.76rem;
            }
        }

        .sidebar-scrim {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(13, 27, 42, 0.5);
            z-index: 150;
        }

        .sidebar-scrim.show {
            display: block;
        }
    </style>
</head>

    <!-- SIDEBAR -->

            <div class="nav-group-label">System</div>
            <a href="#" class="sidebar-link">

    <script>
        const sidebar = document.getElementById('sidebar');
        const scrim = document.getElementById('scrim');
        const menuToggle = document.getElementById('menuToggle');

        function openSidebar() {
            sidebar.classList.add('open');
            scrim.classList.add('show');
        }
        function closeSidebar() {
            sidebar.classList.remove('open');
            scrim.classList.remove('show');
        }
        menuToggle.addEventListener('click', () => {
            sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
        });
        scrim.addEventListener('click', closeSidebar);

        // Filter chips (visual toggle only)
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
            });
        });

        // Fetch inward items
        async function fetchInwardItems() {
            try {
                const res = await fetch('/api/inward');
                if (res.ok) {
                    const items = await res.json();
                    document.getElementById('inwardBadge').textContent = items.length;
                    renderInwardItems(items);
                }
            } catch (err) {
                console.error('Failed to fetch inward items', err);
            }
        }

        function renderInwardItems(items) {
            const tbody = document.getElementById('inwardTableBody');
            tbody.innerHTML = items.map(item => {
                let statusClass = 'pending';
                if (item.status === 'Passed') statusClass = 'passed';
                else if (item.status === 'Rejected') statusClass = 'rejected';
                else if (item.status === 'On Hold') statusClass = 'hold';

                return `
                    <tr>
                        <td><span class="cell-part">${item.grnNo || '-'}</span></td>
                        <td><span class="cell-part">${item.model}</span><span class="cell-sub">P/N ${item.partNo}</span></td>
                        <td>Supplier</td>
                        <td>${Number(item.quantity).toLocaleString('en-IN')}</td>
                        <td><span class="aql-tag">Level II · 1.5</span></td>
                        <td>Pending</td>
                        <td><span class="status-pill ${statusClass}">${item.status}</span></td>
                        <td><button class="row-action">Inspect</button></td>
                    </tr>
                `;
            }).join('');
        }

        fetchInwardItems();
    </script>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userName = localStorage.getItem('userName');
            const userRole = localStorage.getItem('userRole');
            if (userName) {
                const nameEls = document.querySelectorAll('.sidebar-user-name');
                const avatarEls = document.querySelectorAll('.sidebar-avatar');
                const roleEls = document.querySelectorAll('.sidebar-user-role');
                
                nameEls.forEach(el => el.textContent = userName);
                
                const initials = userName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                avatarEls.forEach(el => el.textContent = initials);
                
                if (userRole) {
                    const roleText = userRole.charAt(0).toUpperCase() + userRole.slice(1);
                    roleEls.forEach(el => el.textContent = roleText);
                }
            }
        });
    </script>

<script>function highlightActiveSidebarLink() {    const links = document.querySelectorAll('.sidebar-link');    const currentPath = window.location.pathname.split('/').pop();    links.forEach(l => {        l.classList.remove('active');        if (l.getAttribute('href') === currentPath) {            l.classList.add('active');        }    });}document.addEventListener('DOMContentLoaded', highlightActiveSidebarLink);</script>\n</body>
